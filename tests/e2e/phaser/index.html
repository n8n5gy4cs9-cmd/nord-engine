<!doctype html><meta charset="utf-8"><base href="/"><title>phaser e2e</title>
<body style="margin:0"><div id="game"></div>
<script src="/vendor/phaser/phaser.min.js"></script>
<script type="module">
import { boot } from '/runtime/phaser/phaser.js';
const project = await (await fetch('/tests/e2e/phaser/nord.project.json')).json();
window.__game = await boot(project, { parent: 'game', fetchJSON: (p) => fetch('/' + p).then((r) => r.json()), importScript: (p) => import('/' + p) });
window.__ready = true;
</script>
