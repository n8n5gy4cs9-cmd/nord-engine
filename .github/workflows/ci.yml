name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: node tools/tasks.mjs check
      - run: node tools/vendor.mjs --verify
      - run: node --test runtime/core/*.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # macOS only: the editor with the embedded wry/WKWebView viewport must at least compile + link; bundle must assemble.
      - if: runner.os == 'macOS'
        run: cargo build -p nord-editor --features webview
      - if: runner.os == 'macOS'
        run: ./build.sh
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with: { name: nord-engine-app, path: dist/Nord Engine.app, retention-days: 7 }
  js-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nord-cli   # edit-viewport suites run against the real `nord serve`
      - run: npm i --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/e2e.mjs
