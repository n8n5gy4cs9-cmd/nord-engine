name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (player shell, tray, xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev xvfb
      - run: node tools/tasks.mjs check
      - run: node tools/vendor.mjs --verify
      - run: node tools/build-manual.mjs --check
      - run: node --test runtime/core/*.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # desktop apps (M9): the native player shell must build everywhere; its IPC smoke test runs where a window session exists
      - name: Build nord-player with the window shell
        run: cargo build --release -p nord-player --features shell
      - name: Clippy for the player shell (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy -p nord-player --features shell -- -D warnings
      - name: Player IPC smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        run: node tools/player-smoke.mjs target/release/nord-player --xvfb
      - name: Player IPC smoke (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true   # GUI session on hosted macOS runners is not guaranteed; owner verifies locally
        run: node tools/player-smoke.mjs target/release/nord-player
      - name: Player IPC smoke (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node tools/player-smoke.mjs target/release/nord-player.exe
      - name: Linux portable build (build.sh)
        if: runner.os == 'Linux'
        run: ./build.sh
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with: { name: nord-engine-linux, path: dist/linux/*.tar.gz, retention-days: 7 }
      # macOS only: the editor with the embedded wry/WKWebView viewport must at least compile + link; bundle must assemble.
      - if: runner.os == 'macOS'
        run: cargo build -p nord-editor --features webview
      - if: runner.os == 'macOS'
        run: ./build.sh
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with: { name: nord-engine-app, path: dist/Nord Engine.app, retention-days: 7 }
      # NordPlayer: wrap the 3D example into a standalone game .app (resource swap), ad-hoc signed, smoke-checked
      - if: runner.os == 'macOS'
        run: |
          mkdir -p dist/games
          target/release/nord bundle-mac examples/playground-3d --player target/release/nord-player -o dist/games
          codesign --verify --deep --strict "dist/games/Playground 3D.app" && echo "game app signature OK"
          test -f "dist/games/Playground 3D.app/Contents/Resources/game/index.html"
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with: { name: nord-player-sample-game, path: dist/games/Playground 3D.app, retention-days: 7 }
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - run: ./build-win.sh msvc
      - name: Packaged CLI finds resources outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/windows/NordEngine/nord.exe" doctor
          "$GITHUB_WORKSPACE/dist/windows/NordEngine/nord.exe" build "$GITHUB_WORKSPACE/dist/windows/NordEngine/examples/platformer" -o "$RUNNER_TEMP/nord-example"
      - uses: actions/upload-artifact@v4
        with: { name: nord-engine-windows, path: dist/windows/*.zip, retention-days: 7, if-no-files-found: error }
  js-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev xvfb
      - run: cargo build -p nord-cli   # edit-viewport suites run against the real `nord serve`
      - run: cargo build -p nord-player --features shell   # desktop-player-ipc suite (xvfb)
      - run: npm i --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/e2e.mjs
      # M10 event-sheet / editor-feature suites (Chromium; the multiplayer test needs two pages)
      - name: M10 browser suites
        run: |
          for t in eventsheet-demo es-templates plugin-objects pwa multiplayer viewport-layout compiled-export; do
            node tools/$t-test.mjs
          done
      # M12 FPS Creator addon: node unit tests, file API/CLI, Nord boot, gameplay + editor scenarios (real `nord serve`)
      - name: FPS Creator suites
        run: node tools/fpsc-test.mjs
      - name: 2D Level Creator and sprite bank
        run: |
          node --test editor/level2d/model.test.mjs editor/level2d/items.test.mjs editor/level2d/view.test.mjs tools/creator-games.test.mjs
          node tools/level2d-test.mjs
          node tools/level2d-placement-test.mjs
          node tools/creator-games-test.mjs
      - name: Full coding workshop games
        run: node tools/code-workshops-test.mjs --manual
      - name: Retro and multiplayer full workshops
        run: |
          node --test tools/retro-games.test.mjs tools/office-tedris.test.mjs tools/tutorial-quality.test.mjs tools/tutorial-lessons.test.mjs
          node tools/retro-games-test.mjs
          node tools/office-tedris-test.mjs
          node tools/retro-social-manual-test.mjs
          node tools/desk-apps-test.mjs
      - name: Advanced shader, Node and WASM workshops
        run: |
          node --test tools/advanced-workshops.test.mjs
          rustc --test examples/rust-salvage/src/sim.rs -o /tmp/salvage-tests
          /tmp/salvage-tests
          rustup target add wasm32-unknown-unknown
          target/debug/nord build examples/rust-salvage --target web-wasm-game --out target/e2e/advanced-salvage
          NORD_SALVAGE_EXPORT="$PWD/target/e2e/advanced-salvage" node tools/advanced-workshops-test.mjs --manual
  # M11: the editor in the browser (wasm) and on a server. Desktop jobs above are unaffected by it.
  web-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen CLI (version from Cargo.lock)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked
      - run: cargo test -p nord-editor-server        # path-jail / auth / CSRF / lock / quota / jobs (real server over HTTP)
      - run: tools/build-web-editor.sh
      - run: cargo build -p nord-editor-server -p nord-cli
      - run: npm i --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Web editor in Chromium (create → reload → play → export)
        run: node tools/web-editor-test.mjs
      - name: Server mode (login → sync → reopen → play → server export)
        run: node tools/web-server-test.mjs
  # Export templates: one .nordtemplates per platform, attached to the GitHub release of the tag (editor: Project > Export templates > Download)
  templates:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, platform: mac-arm64, exe: nord-player }
          - { os: macos-13, target: x86_64-apple-darwin, platform: mac-x64, exe: nord-player }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64, exe: nord-player.exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64, exe: nord-player }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, exe: nord-player }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo build --release --target ${{ matrix.target }} -p nord-player --features shell
      - run: cargo build --release -p nord-cli
      - run: target/release/nord template-pack --platform ${{ matrix.platform }} --player target/${{ matrix.target }}/release/${{ matrix.exe }} -o templates-out
      - uses: softprops/action-gh-release@v2
        with: { files: "templates-out/*.nordtemplates" }
