<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nord 2D Level Creator</title><link rel="stylesheet" href="/editor/level2d/style.css"><script>window.__nord={hotReload:()=>true};</script></head><body>
<header><strong><span>2D</span> Level Creator</strong><div class="group"><button data-act="new">New</button><button data-act="open">Open…</button><button data-act="save" class="primary">Save</button><button data-act="saveas">Save as…</button><button data-act="download">Download</button><button data-act="import">Import</button></div><div class="group"><button data-act="undo" title="Undo (Ctrl+Z)">↶</button><button data-act="redo" title="Redo (Ctrl+Shift+Z)">↷</button></div><button data-act="test" class="play">▶ Test · F5</button><button data-act="start">Use as game start</button><button data-act="help">Help</button><span id="filename"></span></header>
<div id="toolbar"><div id="tools"></div><label><input type="checkbox" id="solid" checked> Solid tiles</label><label><input type="checkbox" id="snap" checked> Snap</label><label><input type="checkbox" id="grid" checked> Grid</label><button data-act="fit">Fit · Home</button><span id="mode"></span></div>
<main><aside id="left"><nav id="tabs"></nav><div id="palette"></div></aside><section id="view"><canvas id="map" tabindex="0" aria-label="Level map"></canvas><footer id="status">Loading sprite bank…</footer></section><aside id="inspector"></aside></main>
<dialog id="dialog"><form method="dialog"><div id="dialog-body"></div><div class="row"><button value="cancel">Cancel</button><button id="accept" value="ok" class="primary">OK</button></div></form></dialog>
<div id="test" hidden><iframe title="2D play-test" id="test-frame" allow="autoplay; fullscreen"></iframe><button id="stop">✕ Stop · Shift+Esc</button></div><input id="file" type="file" accept=".json" hidden>
<script type="module" src="/editor/level2d/editor.js"></script></body></html>
