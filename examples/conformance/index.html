<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nord Conformance</title>
<style>html,body{margin:0;height:100%;background:#101418;overflow:hidden}#stage{position:relative;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"nord":"/runtime/core/index.js"}}</script></head>
<body><div id="stage"></div>
<script>
  // ?backend=phaser (default) | babylon — the SAME project/scene/scripts run on either runtime.
  const be = new URLSearchParams(location.search).get('backend') ?? 'phaser';
  const libs = be === 'babylon'
    ? ['babylonjs/babylon.js', 'babylonjs-loaders/babylonjs.loaders.min.js', 'havok/HavokPhysics_umd.js']
    : ['phaser/phaser.min.js'];
  for (const l of libs) document.write(`<script src="/vendor/${l}"><\/script>`);
</script>
<script type="module">
const be = new URLSearchParams(location.search).get('backend') ?? 'phaser';
try {
  const { boot } = await import(`/runtime/${be}/index.js`);
  const project = await (await fetch('nord.project.json')).json();
  await boot(project, { container: document.getElementById('stage'), preserveDrawingBuffer: true });
  window.__nord_ready = true;
} catch (e) { console.error(e); window.__nord_error = String(e); }
</script></body></html>
