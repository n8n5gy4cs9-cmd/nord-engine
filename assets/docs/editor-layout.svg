<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Nord editor panel layout</title><desc id="desc">Diagram, not a screenshot. Toolbar on top, Hierarchy on the left, Scene and Game in the middle, Inspector on the right, Assets and Console below.</desc>
<rect width="1000" height="560" rx="20" fill="#11151f"/>
<g font-family="system-ui,sans-serif" fill="#e7edf8"><text x="28" y="38" font-size="13" fill="#a2afc4">EDITOR MAP · WHERE TO FIND THINGS</text>
<rect x="24" y="56" width="952" height="60" rx="10" fill="#222b3b"/><text x="44" y="82" font-size="17" font-weight="700">Toolbar</text><text x="44" y="102" font-size="13" fill="#a2afc4">Project · Play / Stop · Move / Rotate / Scale · Export · Docs</text>
<rect x="24" y="128" width="206" height="262" rx="10" fill="#191f2c"/><text x="42" y="158" font-size="18" font-weight="700" fill="#78b8ff">1. Hierarchy</text><text x="42" y="181" font-size="13" fill="#a2afc4">Choose a thing</text><text x="48" y="225" font-size="15">▾ Main scene</text><text x="62" y="255" font-size="15">Player</text><text x="62" y="285" font-size="15">Camera</text><text x="62" y="315" font-size="15">Floor</text><text x="42" y="367" font-size="12" fill="#a2afc4">Entities live in this tree.</text>
<rect x="242" y="128" width="464" height="262" rx="10" fill="#162635"/><text x="262" y="158" font-size="18" font-weight="700" fill="#75d7b1">2. Scene / Game</text><text x="262" y="184" font-size="13" fill="#a2afc4">Arrange it · then try it</text><path d="M270 330H675 M310 215V355 M370 215V355 M430 215V355 M490 215V355 M550 215V355 M610 215V355 M270 270H675" stroke="#2a3548"/><rect x="422" y="249" width="72" height="72" rx="8" fill="#78b8ff"/><path d="M458 285V220 M458 285H526" stroke="#ffd28a" stroke-width="3"/><text x="262" y="367" font-size="12" fill="#a2afc4">Scene edits your level. Game shows the player’s view.</text>
<rect x="718" y="128" width="258" height="262" rx="10" fill="#191f2c"/><text x="738" y="158" font-size="18" font-weight="700" fill="#c7a5ff">3. Inspector</text><text x="738" y="181" font-size="13" fill="#a2afc4">Change its settings</text><text x="738" y="225" font-size="15">Name: Player</text><text x="738" y="255" font-size="15">Position: x · y · z</text><text x="738" y="285" font-size="15">Components</text><text x="738" y="315" font-size="15">Scripts and attributes</text><text x="738" y="367" font-size="12" fill="#a2afc4">Settings for the selected entity.</text>
<rect x="24" y="402" width="682" height="128" rx="10" fill="#191f2c"/><text x="44" y="432" font-size="18" font-weight="700" fill="#ffd28a">Assets / Library</text><text x="44" y="458" font-size="14" fill="#a2afc4">Find pictures, models, sounds and ready-made scripts.</text><text x="44" y="498" font-size="14">Folders → files → drag or insert into your project</text>
<rect x="718" y="402" width="258" height="128" rx="10" fill="#191f2c"/><text x="738" y="432" font-size="18" font-weight="700" fill="#ff989d">Console</text><text x="738" y="458" font-size="14" fill="#a2afc4">Read messages and errors.</text><text x="738" y="498" font-size="13" fill="#a2afc4">Click a file:line to open it.</text></g></svg>
