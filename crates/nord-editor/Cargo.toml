[package]
name = "nord-editor"
description = "Nord Engine native editor (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nord-editor"
path = "src/main.rs"

[features]
default = []
# wry child webview for viewport/preview/docs (macOS target; see docs/DECISIONS.md)
webview = ["dep:wry", "dep:objc2", "dep:block2"]

[dependencies]
nord-core = { path = "../nord-core" }
nord-desktop = { path = "../nord-desktop" }
nord-export = { path = "../nord-export" }
regex = "1"
web-time = "1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
egui = "0.31"
qrcode = { version = "0.14", default-features = false }
egui_extras = { version = "0.31", features = ["svg", "image", "file"] }
egui_dock = { version = "0.16", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

nord-serve = { path = "../nord-serve" }

# native shell (desktop). The web build (wasm32) uses eframe's web backend instead; see docs/WEB_EDITOR_PLAN.md
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nord-serve = { path = "../nord-serve", features = ["native"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = "0.15"
wry = { version = "0.50", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tokio = { version = "1", features = ["sync"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "CssStyleDeclaration", "MessageEvent", "EventTarget", "Node"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = { version = "0.31", default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
