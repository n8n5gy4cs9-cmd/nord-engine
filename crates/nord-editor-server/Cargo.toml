[package]
name = "nord-editor-server"
description = "Nord Engine editor on a Linux/any server: serves the wasm editor + a path-jailed project API, jobs and auth (M11)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nord-editor-server"
path = "src/main.rs"

[dependencies]
nord-core = { path = "../nord-core" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
argon2 = "0.5"
getrandom = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
