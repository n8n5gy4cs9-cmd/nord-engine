[package]
name = "nord-editor-web"
description = "Nord Engine editor in the browser: wasm entry point for nord-editor (eframe web). Empty on native targets."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything lives under wasm32 so `cargo build --workspace` on desktop is unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nord-editor = { path = "../nord-editor" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
console_error_panic_hook = "0.1"
