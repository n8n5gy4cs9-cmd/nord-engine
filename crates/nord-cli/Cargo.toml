[package]
name = "nord-cli"
description = "The `nord` command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nord"
path = "src/main.rs"

[dependencies]
nord-core = { path = "../nord-core" }
nord-serve = { path = "../nord-serve" }
nord-export = { path = "../nord-export" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

