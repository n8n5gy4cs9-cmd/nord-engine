[package]
name = "nord-serve"
description = "Nord dev server: static project + runtime, live reload, editor <-> viewport/game bridge (/api/*)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# real dialogs/clipboard/notifications for the dev `/__desktop` bridge (headless stubs otherwise)
native = ["nord-desktop/native"]

[dependencies]
nord-core = { path = "../nord-core" }
nord-desktop = { path = "../nord-desktop" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
