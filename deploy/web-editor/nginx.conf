# nginx in front of nord-editor-server (TLS terminates here). Replace the server_name and certificate paths.
server {
    listen 443 ssl http2;
    server_name nord.example.com;
    ssl_certificate     /etc/letsencrypt/live/nord.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nord.example.com/privkey.pem;

    client_max_body_size 300m;          # >= --max-upload-mb
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;            # server-sent events (project events, job logs)
        proxy_read_timeout 1h;
    }
}
server { listen 80; server_name nord.example.com; return 301 https://$host$request_uri; }
